<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07131c"><title>Controle de Empréstimos</title>
<style>
:root{--bg:#07131c;--panel:#10232f;--panel2:#132b38;--gold:#f4c542;--text:#f7f7f7;--muted:#9db0ba;--green:#26c281;--red:#ff5b61;--blue:#4c9aff}
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;font-family:Inter,Arial,sans-serif;color:#18232b}button,input,select{font:inherit}button{border:0;cursor:pointer}.app{max-width:520px;margin:auto;background:#f3f5f7;min-height:100vh}.top{background:linear-gradient(145deg,#07131c,#102a38);color:#fff;padding:22px 18px 28px;border-radius:0 0 26px 26px}.topline{display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:800}.hello{margin-top:22px;color:#c9d4da;font-size:13px}.big{font-size:30px;font-weight:800;margin-top:4px}.main{padding:16px 16px 95px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:-12px}.card{padding:15px;border-radius:17px;color:white;box-shadow:0 7px 20px #00000016}.card .lab{font-size:11px;opacity:.85}.card b{display:block;font-size:20px;margin-top:7px}.c1{background:#1b8f63}.c2{background:#397fd8}.c3{background:#e58a19}.c4{background:#7856c9}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}.sectionTitle h2{font-size:17px;margin:0}.link{background:none;color:#397fd8;font-size:12px;font-weight:700}.item{background:white;border-radius:16px;padding:14px;margin:9px 0;box-shadow:0 3px 14px #0000000b}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#e8f0f5;font-weight:800}.person{display:flex;gap:10px;align-items:center}.small{font-size:12px;color:#71808a}.money{font-weight:800}.badge{padding:5px 8px;border-radius:20px;font-size:10px;font-weight:800}.ok{background:#dcf7ea;color:#138458}.late{background:#ffe1e3;color:#c72e35}.open{background:#fff0cf;color:#9a6500}.actions{display:flex;gap:8px;margin-top:12px}.btn{padding:11px 13px;border-radius:10px;font-weight:800;flex:1}.primary{background:#eabf3b;color:#101820}.dark{background:#10232f;color:white}.danger{background:#ffe2e3;color:#b92d34}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:72px;background:white;border-top:1px solid #e2e6e9;display:flex;z-index:5}.nav button{flex:1;background:white;color:#73818a;font-size:11px;font-weight:700}.nav .sel{color:#b18413}.plus{width:54px!important;height:54px;border-radius:50%;background:var(--gold)!important;color:#17212a!important;font-size:27px!important;margin-top:-18px;box-shadow:0 7px 18px #0003}.screen{display:none}.screen.active{display:block}.search{width:100%;padding:13px 14px;border:1px solid #dce3e7;border-radius:12px;margin-bottom:8px;outline:0}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:10}.modal.show{display:flex}.sheet{background:white;width:min(520px,100%);margin:auto 0 0;border-radius:22px 22px 0 0;padding:20px;max-height:91vh;overflow:auto}.sheet h2{margin:0 0 16px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;padding:12px;border:1px solid #d5dde1;border-radius:10px;background:white}.preview{background:#f2f5f6;border-radius:12px;padding:12px;margin:12px 0}.close{float:right;background:#edf0f2;border-radius:50%;width:34px;height:34px}.empty{text-align:center;color:#77858e;padding:30px}.heroBtn{width:100%;padding:14px;border-radius:12px;background:var(--green);color:white;font-weight:800;margin-top:8px}
</style></head><body><div class="app">
<div id="home" class="screen active"><div class="top"><div class="topline"><div class="brand">💰 Controle de Empréstimos</div><div>⚙️</div></div><div class="hello">Resumo financeiro</div><div class="big" id="topTotal">R$ 0,00</div><div class="hello">total contratado</div></div><div class="main"><div class="cards"><div class="card c1"><span class="lab">A RECEBER</span><b id="rReceber">R$ 0</b></div><div class="card c2"><span class="lab">JÁ RECEBI</span><b id="rRecebido">R$ 0</b></div><div class="card c3"><span class="lab">EM ATRASO</span><b id="rAtrasado">R$ 0</b></div><div class="card c4"><span class="lab">CLIENTES</span><b id="rClientes">0</b></div></div><div class="sectionTitle"><h2>Próximos recebimentos</h2><button class="link" onclick="go('loans')">Ver todos</button></div><div id="upcoming"></div></div></div>
<div id="clients" class="screen"><div class="top"><div class="topline"><div class="brand">👥 Clientes</div><button class="close" onclick="newClient()">＋</button></div><div class="hello">Sua carteira de clientes</div></div><div class="main"><input class="search" id="search" placeholder="🔎 Buscar cliente..." oninput="render()"><div id="clientList"></div></div></div>
<div id="loans" class="screen"><div class="top"><div class="topline"><div class="brand">💵 Empréstimos</div><button class="close" onclick="newLoan()">＋</button></div><div class="hello">Acompanhe parcelas e pagamentos</div></div><div class="main"><div id="loanList"></div></div></div>
<div id="more" class="screen"><div class="top"><div class="brand">📊 Resumo</div><div class="hello">Visão geral dos seus empréstimos</div></div><div class="main" id="report"></div></div>
<div class="nav"><button id="nHome" onclick="go('home')">⌂<br>Início</button><button id="nClients" onclick="go('clients')">♙<br>Clientes</button><button class="plus" onclick="newLoan()">＋</button><button id="nLoans" onclick="go('loans')">▣<br>Empréstimos</button><button id="nMore" onclick="go('more')">☰<br>Mais</button></div></div>
<div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><h2 id="mt"></h2><div id="mb"></div></div></div>
<script>
const K='ce_v2';let db=JSON.parse(localStorage.getItem(K)||'{"clients":[],"loans":[]}');const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n||0);const date=()=>new Date().toISOString().slice(0,10);
function save(){localStorage.setItem(K,JSON.stringify(db));render()}function go(s){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(s).classList.add('active');['Home','Clients','Loans','More'].forEach(x=>$('n'+x).classList.remove('sel'));$('n'+s[0].toUpperCase()+s.slice(1)).classList.add('sel');render()}
function openM(t,b){$('mt').textContent=t;$('mb').innerHTML=b;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}
function newClient(){openM('Novo cliente',`<div class="field"><label>Nome completo</label><input id="cn" placeholder="Nome"></div><div class="field"><label>WhatsApp / telefone</label><input id="ct" placeholder="(11) 99999-9999"></div><div class="field"><label>Observação</label><input id="co" placeholder="Opcional"></div><button class="heroBtn" onclick="addClient()">Salvar cliente</button>`)}
function addClient(){if(!cn.value.trim())return alert('Informe o nome.');db.clients.push({id:Date.now(),name:cn.value.trim(),tel:ct.value.trim(),obs:co.value.trim()});save();closeModal();go('clients')}
function newLoan(){if(!db.clients.length){alert('Cadastre um cliente primeiro.');go('clients');return}let op=db.clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');openM('Novo empréstimo',`<div class="field"><label>Cliente</label><select id="lc">${op}</select></div><div class="field"><label>Valor emprestado</label><input id="lv" type="number" step=".01" placeholder="1000" oninput="preview()"></div><div class="field"><label>Juros (%)</label><input id="lj" type="number" step=".01" placeholder="20" oninput="preview()"></div><div class="field"><label>Quantidade de parcelas</label><input id="lp" type="number" value="4" min="1" oninput="preview()"></div><div class="field"><label>Periodicidade</label><select id="lf"><option value="m">Mensal</option><option value="q">Quinzenal</option><option value="s">Semanal</option></select></div><div class="field"><label>Primeiro vencimento</label><input id="ld" type="date" value="${date()}"></div><div class="preview" id="pv">Informe o valor e os juros.</div><button class="heroBtn" onclick="addLoan()">Salvar empréstimo</button>`);preview()}
function preview(){let v=+$('lv')?.value||0,j=+$('lj')?.value||0,p=+$('lp')?.value||1,total=v*(1+j/100);if($('pv'))$('pv').innerHTML=`Total a receber: <b>${money(total)}</b><br>Valor por parcela: <b>${money(total/p)}</b>`}
function addLoan(){let v=+lv.value,j=+lj.value,p=+lp.value;if(!v||p<1)return alert('Preencha valor e parcelas.');let total=v*(1+j/100),par=total/p,arr=[];for(let i=0;i<p;i++){let d=new Date(ld.value+'T12:00:00');if(lf.value==='m')d.setMonth(d.getMonth()+i);else d.setDate(d.getDate()+i*(lf.value==='q'?15:7));arr.push({n:i+1,value:par,due:d.toISOString().slice(0,10),paid:false})}db.loans.push({id:Date.now(),clientId:+lc.value,value:v,interest:j,total,installments:arr,created:date()});save();closeModal();go('loans')}
function pay(id,n){let l=db.loans.find(x=>x.id===id),p=l.installments.find(x=>x.n===n);if(confirm('Marcar esta parcela como paga?')){p.paid=true;p.paidAt=date();save()}}
function st(p){if(p.paid)return['Paga','ok'];if(p.due<date())return['Atrasada','late'];return['Em aberto','open']}function cli(id){return db.clients.find(x=>x.id===id)||{name:'Cliente'}}
function render(){let rec=0,got=0,late=0,total=0;db.loans.forEach(l=>{total+=l.total;l.installments.forEach(p=>{if(p.paid)got+=p.value;else{rec+=p.value;if(p.due<date())late+=p.value}})});$('topTotal').textContent=money(total);$('rReceber').textContent=money(rec);$('rRecebido').textContent=money(got);$('rAtrasado').textContent=money(late);$('rClientes').textContent=db.clients.length;
let up=[];db.loans.forEach(l=>l.installments.forEach(p=>{if(!p.paid)up.push({p,l})}));up.sort((a,b)=>a.p.due.localeCompare(b.p.due));$('upcoming').innerHTML=up.slice(0,5).map(x=>{let [s,c]=st(x.p);return `<div class="item row"><div class="person"><div class="avatar">👤</div><div><b>${cli(x.l.clientId).name}</b><div class="small">${x.p.due.split('-').reverse().join('/')} · parcela ${x.p.n}</div></div></div><div style="text-align:right"><b>${money(x.p.value)}</b><br><span class="badge ${c}">${s}</span></div></div>`}).join('')||'<div class="empty">Nenhum pagamento pendente.</div>';
let q=($('search')?.value||'').toLowerCase();$('clientList').innerHTML=db.clients.filter(c=>c.name.toLowerCase().includes(q)).map(c=>{let saldo=db.loans.filter(l=>l.clientId===c.id).reduce((a,l)=>a+l.installments.filter(p=>!p.paid).reduce((s,p)=>s+p.value,0),0);let late=db.loans.filter(l=>l.clientId===c.id).some(l=>l.installments.some(p=>!p.paid&&p.due<date()));return `<div class="item row"><div class="person"><div class="avatar">👤</div><div><b>${c.name}</b><div class="small">${c.tel||'Sem telefone'}</div></div></div><div style="text-align:right"><span class="badge ${late?'late':'ok'}">${late?'Em atraso':'Em dia'}</span><br><b>${money(saldo)}</b></div></div>`}).join('')||'<div class="empty">Nenhum cliente encontrado.</div>';
$('loanList').innerHTML=db.loans.slice().reverse().map(l=>{let c=cli(l.clientId),paid=l.installments.filter(p=>p.paid).length;return `<div class="item"><div class="row"><div class="person"><div class="avatar">💰</div><div><b>${c.name}</b><div class="small">${money(l.value)} · ${l.interest}% de juros</div></div></div><span class="badge ${paid===l.installments.length?'ok':'open'}">${paid}/${l.installments.length}</span></div><div style="margin-top:12px">${l.installments.map(p=>{let[s,cl]=st(p);return `<div class="row" style="padding:9px 0;border-top:1px solid #edf0f2"><span>Parcela ${p.n} · ${p.due.split('-').reverse().join('/')}</span><span><b>${money(p.value)}</b> <button class="badge ${cl}" onclick="pay(${l.id},${p.n})">${s}</button></span></div>`}).join('')}</div></div>`}).join('')||'<div class="empty">Nenhum empréstimo cadastrado.</div>';
$('report').innerHTML=`<div class="item"><h3>Resumo geral</h3><p>Capital emprestado <b style="float:right">${money(db.loans.reduce((a,l)=>a+l.value,0))}</b></p><p>Juros previstos <b style="float:right">${money(db.loans.reduce((a,l)=>a+l.total-l.value,0))}</b></p><p>Total contratado <b style="float:right">${money(total)}</b></p><p>Já recebido <b style="float:right">${money(got)}</b></p><p>Em aberto <b style="float:right">${money(rec)}</b></p><p>Em atraso <b style="float:right;color:#c72e35">${money(late)}</b></p></div>`}
go('home');
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
</body></html>
